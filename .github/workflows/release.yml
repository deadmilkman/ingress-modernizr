name: release

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - plugin/**
      - scripts/test/**
      - .github/workflows/release.yml

concurrency:
  group: latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm 3
        run: |
          curl -fsSL "https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz" -o /tmp/helm-v3.18.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm-v3.18.0-linux-amd64.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Unit tests
        run: go test ./...

      - name: Helm 3 integration check
        run: scripts/test/integration-helm3.sh

      - name: Helm 4 integration check
        run: |
          if docker manifest inspect alpine/helm:4.1.1 >/dev/null 2>&1; then
            cat >/tmp/helm4-docker <<'EOF'
          #!/usr/bin/env sh
          exec docker run --rm \
            -v "$PWD:$PWD" \
            -v /tmp:/tmp \
            -w "$PWD" \
            -e HELM_CONFIG_HOME \
            -e HELM_CACHE_HOME \
            -e HELM_DATA_HOME \
            -e INGRESS2GATEWAY_BIN \
            -e ING2GW_ARGS_FILE \
            alpine/helm:4.1.1 "$@"
          EOF
            chmod +x /tmp/helm4-docker
            HELM4_BIN=/tmp/helm4-docker scripts/test/integration-helm4.sh || HELM4_AUTO_DOWNLOAD=1 HELM4_VERSION=4.1.1 scripts/test/integration-helm4.sh
          else
            HELM4_AUTO_DOWNLOAD=1 HELM4_VERSION=4.1.1 scripts/test/integration-helm4.sh
          fi

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release asset
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          version="latest"

          asset_base="ingress-modernizr_${version}_${GOOS}_${GOARCH}"
          package_dir="dist/${asset_base}"
          binary="ingress-modernizr"
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          mkdir -p "$package_dir"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w" -o "$package_dir/$binary" main.go

          cp plugin/helm4/plugin.yaml "$package_dir/plugin.yaml"
          cp README.md "$package_dir/README.md"

          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -r "${asset_base}.zip" "$asset_base")
          else
            tar -C dist -czf "dist/${asset_base}.tar.gz" "$asset_base"
          fi
          rm -rf "$package_dir"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ingress-modernizr_* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          legacy_tag="rolling"
          if gh release view "$legacy_tag" >/dev/null 2>&1; then
            gh release delete "$legacy_tag" --yes --cleanup-tag
          fi

          tag="latest"
          notes="Latest build from main at ${GITHUB_SHA}."

          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" \
              --title "latest" \
              --notes "$notes" \
              --latest \
              --target "$GITHUB_SHA"
          else
            gh release create "$tag" release-assets/* \
              --title "latest" \
              --notes "$notes" \
              --latest \
              --target "$GITHUB_SHA"
          fi
